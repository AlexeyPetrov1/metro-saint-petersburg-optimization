<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<style>
/*__UI_CSS__*/
.wrap { display: grid; grid-template-columns: minmax(0, 1fr); gap: 12px; padding: 2px 2px 8px; }

/* Console */
.console { background: var(--console); color: #fff; border-radius: 12px; padding: 12px 16px 8px; }
.row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; row-gap: 8px; }
.row > * { min-width: 0; }
.btn { width: 38px; height: 38px; border-radius: 10px; border: 0; cursor: pointer; display: grid; place-items: center; color: #fff; background: var(--console-2); }
.btn:hover { filter: brightness(1.2); }
.btn:focus-visible, .seg button:focus-visible, select:focus-visible, .scrub:focus-visible, .acts li:focus-visible { outline: 2px solid #fff; outline-offset: 2px; }
.btn.play { width: 48px; height: 48px; border-radius: 50%; background: var(--calm); }
.btn.play.on { background: var(--tight); color: var(--ink); }
.btn.stop { background: var(--over); }
.btn.stepb { background: var(--step); }
.btn svg { width: 19px; height: 19px; fill: currentColor; }
.btn.play svg { width: 23px; height: 23px; }
.clock { margin-left: 6px; }
.clock b { font-size: 30px; font-weight: 600; line-height: 1; }
.clock span { display: block; color: #AEB7C4; font-size: 12px; margin-top: 3px; }
.spacer { flex: 1; }
.ctl { display: grid; gap: 3px; color: #AEB7C4; font-size: 11.5px; }
.seg { display: flex; background: var(--console-2); border-radius: 8px; padding: 3px; }
.seg button { border: 0; background: transparent; color: #DDE3EA; padding: 5px 9px; border-radius: 6px; cursor: pointer; font: inherit; }
.seg button.on { background: #fff; color: var(--ink); font-weight: 600; }
select { font: inherit; color: #fff; background: var(--console-2); border: 1px solid var(--console-rule);
  border-radius: 8px; padding: 6px 30px 6px 10px; appearance: none; cursor: pointer;
  background-image: linear-gradient(45deg, transparent 50%, #AEB7C4 50%), linear-gradient(135deg, #AEB7C4 50%, transparent 50%);
  background-position: calc(100% - 15px) 52%, calc(100% - 10px) 52%; background-size: 5px 5px; background-repeat: no-repeat; }
.scrub { position: relative; margin-top: 22px; height: 58px; cursor: grab; touch-action: none; user-select: none; }
.scrub.drag { cursor: grabbing; }
.scrub canvas { position: absolute; left: 0; top: 0; width: 100%; height: 44px; }
.scrub .hours { position: absolute; left: 0; right: 0; bottom: 0; height: 14px; color: #8994A3; font-size: 11px; }
.scrub .hours i { position: absolute; transform: translateX(-50%); font-style: normal; }
.keys { color: #8994A3; font-size: 11px; margin-top: 4px; }
.thumb { position: absolute; top: -4px; width: 3px; height: 52px; margin-left: -1px; background: #fff; border-radius: 2px; pointer-events: none; box-shadow: 0 0 0 3px rgba(255,255,255,.18); }
.thumb::after { content: attr(data-t); position: absolute; top: -19px; left: 50%; transform: translateX(-50%);
  background: #fff; color: var(--ink); font-size: 11px; font-weight: 600; padding: 1px 6px; border-radius: 4px; }

/* Panels */
.panel .sub { color: var(--muted); font-size: 12.5px; margin: 3px 0 8px; }
.legend .dm { width: 9px; height: 9px; transform: rotate(45deg); border-radius: 1px; margin: 0 6px 0 2px; border-color: var(--ink); }
.heat { position: relative; }
.heat canvas { width: 100%; display: block; cursor: grab; touch-action: none; }
.heat canvas.drag { cursor: grabbing; }
.tip { position: absolute; pointer-events: none; background: var(--ink); color: #fff; font-size: 12px; padding: 6px 8px;
  border-radius: 6px; white-space: nowrap; display: none; z-index: 2; }
.kpis { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 12px; }
.kpi .lab { color: var(--muted); font-size: 12.5px; }
.kpi .val { font-size: 28px; font-weight: 600; margin: 4px 0 6px; }
.two { display: grid; grid-template-columns: minmax(0, 3fr) minmax(0, 2fr); gap: 12px; }

/* Strip */
#strip .sg { transform-box: fill-box; transform-origin: center; transition: transform .18s ease, filter .18s ease; }
#strip .sg:hover { transform: scale(1.14); filter: drop-shadow(0 3px 4px rgba(27,36,48,.28)); }
#strip .hl { stroke: var(--ink); stroke-width: 2.5; }
#strip .hl.crit { stroke: var(--over); animation: pulse 1.1s ease-in-out infinite; }
@keyframes pulse { 50% { stroke-opacity: .25; } }

/* Actions sequence */
.acts { max-height: 300px; overflow: auto; margin: 0; padding: 0; list-style: none; position: relative; }
.acts li { display: grid; grid-template-columns: 44px minmax(0, 1fr); gap: 8px; padding: 7px 8px 7px 10px; border-left: 3px solid transparent;
  border-top: 1px solid var(--rule); font-size: 13px; cursor: pointer; transition: background .25s, opacity .25s; }
.acts li:first-child { border-top: 0; }
.acts li:hover { background: #F2F6FA; }
.acts li.future { opacity: .4; }
.acts li.crit { border-left-color: var(--over); }
.acts li.current { background: #E8F2FB; }
.acts li.crit, .acts li.crit:hover, .acts li.crit.current, .acts li.crit.future, .acts li.crit.flash { border-left-color: var(--over); }
.acts .ba { display: none; white-space: normal; overflow-wrap: anywhere; font-size: 12px; color: var(--ink); margin-top: 2px; }
.acts li:hover .ba, .acts li:focus-visible .ba { display: block; }
.acts .ba .good { color: var(--good); font-weight: 600; }
.acts .ba .bad { color: var(--over); font-weight: 600; }
#strip .sg rect.focus, #strip rect.focus { stroke: var(--ink); stroke-width: 2.5; stroke-dasharray: none; animation: none; }
.acts li.flash { animation: flash 1.2s ease-out; }
@keyframes flash { 0% { background: #FFE9C7; } 100% { background: #E8F2FB; } }
.acts b { font-weight: 600; }
.acts .st { color: var(--muted); font-size: 12px; display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.acts .badge[hidden] { display: none; }
.acts .badge { display: inline-block; font-size: 11px; color: #fff; background: var(--over); border-radius: 4px; padding: 0 5px; margin-left: 4px; }
.acts li.err b { color: var(--over); }
.count { font-size: 12px; color: var(--muted); background: #EEF1F4; border-radius: 999px; padding: 1px 8px; }
.critn { font-size: 12px; color: #fff; background: var(--over); border-radius: 999px; padding: 1px 8px; }
.critn[hidden] { display: none; }</style>
</head>
<body>
<div class="wrap">
  <div id="banner"></div>
  <section class="console" aria-label="Проигрыватель симуляции" title="Клавиши: ← → шаг 15 минут, Shift + ← → час, ↑ ↓ скорость, Home и End, пробел — пуск и пауза">
    <div class="row">
      <button class="btn stepb" id="back" title="Назад на 15 минут" aria-label="Назад на 15 минут"><svg viewBox="0 0 24 24"><path d="M6 5h2v14H6zM20 5v14L9 12z"/></svg></button>
      <button class="btn play" id="play" title="Пуск (пробел)" aria-label="Пуск"><svg viewBox="0 0 24 24" id="playIcon"><path d="M7 4v16l13-8z"/></svg></button>
      <button class="btn stop" id="stop" title="Стоп: к началу движения" aria-label="Стоп"><svg viewBox="0 0 24 24"><path d="M6 6h12v12H6z"/></svg></button>
      <button class="btn stepb" id="next" title="Вперёд на 15 минут" aria-label="Вперёд на 15 минут"><svg viewBox="0 0 24 24"><path d="M16 5h2v14h-2zM4 5v14l11-7z"/></svg></button>
      <div class="clock"><b id="clock">05:15</b><span id="meta"></span></div>
      <div class="spacer"></div>
      <label class="ctl">Скорость
        <div class="seg" id="speed"><button data-s="1" class="on">×1</button><button data-s="2">×2</button><button data-s="4">×4</button></div>
      </label>
      <label class="ctl">Режим
        <select id="mode">
          <option value="baseline">Без управления</option>
          <option value="policy" selected>С политикой</option>
          <option value="diff">Разница</option>
        </select>
      </label>
    </div>
    <div class="scrub" id="scrub" tabindex="0" role="slider" aria-label="Время симуляции"
         title="Кривая — сколько людей ждут, полоса — самая загруженная точка линии, ромбы — решения политики. Тяните, чтобы перемотать.">
      <canvas id="overview"></canvas>
      <div class="thumb" id="thumb" data-t="05:15"></div>
      <div class="hours" id="hours"></div>
    </div>
  </section>

  <section class="panel">
    <div class="head" style="margin-bottom:8px" title="Тяните по карте, чтобы перемотать"><h3>Загрузка линии за день</h3><div class="legend" id="legend"></div></div>
    <div class="heat"><canvas id="heat"></canvas><div class="tip" id="tip"></div></div>
  </section>

  <section class="kpis">
    <div class="panel kpi"><div class="lab">Ждут на станциях сейчас</div><div class="val" id="k_wait">0</div><span class="chip" id="d_wait"></span></div>
    <div class="panel kpi"><div class="lab">Перегонов с перегрузкой сейчас</div><div class="val" id="k_over">0</div><span class="chip" id="d_over"></span></div>
    <div class="panel kpi"><div class="lab">Отказы в посадке с начала дня</div><div class="val" id="k_denied">0</div><span class="chip" id="d_denied"></span></div>
    <div class="panel kpi"><div class="lab">Ожидание с начала дня, пасс·мин</div><div class="val" id="k_wpm">0</div><span class="chip" id="d_wpm"></span></div>
    <div class="panel kpi"><div class="lab">Поездов на линии сейчас</div><div class="val" id="k_trains">0</div><span class="chip" id="d_trains"></span></div>
  </section>

  <section class="panel">
    <h3 id="nowTitle" style="margin-bottom:4px">Линия сейчас</h3>
    <svg id="strip" width="100%" height="272"></svg>
  </section>

  <section class="two">
    <div class="panel">
      <h3>Ждут на станциях за день</h3>
      <div class="sub" id="waitSub"></div>
      <svg id="wait" width="100%" height="250" style="cursor:grab;touch-action:none"></svg>
    </div>
    <div class="panel">
      <div class="head" style="margin-bottom:8px"><h3>Решения политики</h3><span class="count" id="actCount" title="применено из всех решений"></span><span class="critn" id="actCrit" title="решений, снимающих перегрузку"></span></div>
      <ul class="acts" id="acts"></ul>
    </div>
  </section>
</div>

<script>
//__UI_JS__
const P = __PAYLOAD__;
const N = P.times.length, S = P.segs.length, ST = P.stations.length, DIRS = ["north", "south"];
const state = { pos: P.first, playing: false, speed: 1, mode: "policy" };
let dirty = true;
let focusAct = -1; // decision under the pointer / keyboard focus: highlights its target and window

// ---------- helpers ----------
const at = (arr, pos) => { const k = Math.floor(pos); return lerp(arr[k], arr[Math.min(k + 1, N - 1)], pos - k); };
const diffBand = (d) => d == null ? null : d < -0.05 ? C.good : d > 0.05 ? C.over : "#EEF1F4";
const variantOf = () => state.mode === "baseline" ? "baseline" : "policy";
const clampPos = (p) => Math.min(P.last, Math.max(P.first, p));
let follow = true; // the decision list scrolls with time until the user scrolls it by hand
function seek(p) { state.pos = clampPos(p); dirty = true; follow = true; }

// Grab-and-drag to seek on any element; mapper turns a pointer position into a frame position (or null).
function dragArea(elm, mapper, onStart) {
  let active = false;
  elm.addEventListener("pointerdown", (e) => { const p = mapper(e.clientX, e.clientY); if (p == null) return;
    active = true; setPlaying(false); elm.classList.add("drag"); elm.setPointerCapture(e.pointerId); seek(p); if (onStart) onStart(); });
  elm.addEventListener("pointermove", (e) => { if (!active) return; const p = mapper(e.clientX, e.clientY, true); if (p != null) seek(p); });
  const end = () => { if (!active) return; active = false; elm.classList.remove("drag"); seek(Math.round(state.pos)); };
  elm.addEventListener("pointerup", end); elm.addEventListener("pointercancel", end);
}

// ---------- scrubber ----------
const peaks = {};
for (const v of ["baseline", "policy"]) { peaks[v] = [];
  for (let k = 0; k < N; k++) { let m = null; for (const d of DIRS) for (const row of P.data[v].ratio[d]) if (row[k] != null) m = Math.max(m ?? 0, row[k]); peaks[v].push(m); } }
const maxWait = Math.max(1, ...P.data.baseline.kpi.waiting, ...P.data.policy.kpi.waiting);
let ovCache = null;
function buildOverview() {
  const cv = $("overview"), w = cv.clientWidth, h = 44, dpr = devicePixelRatio || 1; if (!w) return;
  const off = document.createElement("canvas"); off.width = w * dpr; off.height = h * dpr; const g = off.getContext("2d"); g.scale(dpr, dpr);
  const v = variantOf(), wq = P.data[v].kpi.waiting, x0 = P.first, n = P.last - x0 + 1, cw = w / n, base = 30;
  g.fillStyle = "#143657"; g.fillRect(0, 0, w, h);
  g.beginPath(); g.moveTo(0, base);
  for (let k = x0; k <= P.last; k++) g.lineTo((k - x0 + 0.5) * cw, base - 22 * wq[k] / maxWait);
  g.lineTo(w, base); g.closePath(); g.fillStyle = "rgba(125,183,227,.35)"; g.fill();
  for (let k = x0; k <= P.last; k++) { g.fillStyle = band(peaks[v][k]) || "#1C3D60"; g.fillRect((k - x0) * cw, 34, Math.ceil(cw), 10); }
  ovCache = { off, cw, x0 };
  const hrs = $("hours"); hrs.innerHTML = "";
  for (let k = x0; k <= P.last; k++) if (P.times[k].endsWith(":00") && +P.times[k].slice(0, 2) % 2 === 0) {
    const i = document.createElement("i"); i.style.left = ((k - x0 + 0.5) * cw) + "px"; i.textContent = P.times[k]; hrs.appendChild(i); }
}
function drawOverview() {
  if (!ovCache) buildOverview(); if (!ovCache) return;
  const cv = $("overview"), dpr = devicePixelRatio || 1, { off, cw, x0 } = ovCache;
  if (cv.width !== off.width || cv.height !== off.height) { cv.width = off.width; cv.height = off.height; }
  const g = cv.getContext("2d"); g.setTransform(1, 0, 0, 1, 0, 0); g.drawImage(off, 0, 0); g.scale(dpr, dpr);
  for (const a of P.actions) { if (a.k < x0 || a.k > P.last) continue;
    const x = (a.k - x0 + 0.5) * cw; g.globalAlpha = a.k <= state.pos ? 1 : 0.4;
    g.fillStyle = a.critical ? C.over : a.error ? "#FFB020" : "#fff";
    g.beginPath(); g.moveTo(x, 1); g.lineTo(x + 4, 5); g.lineTo(x, 9); g.lineTo(x - 4, 5); g.closePath(); g.fill(); }
  g.globalAlpha = 1;
}
dragArea($("scrub"), (cx) => { const r = $("scrub").getBoundingClientRect();
  return P.first + Math.min(1, Math.max(0, (cx - r.left) / r.width)) * (P.last - P.first + 1) - 0.5; });
// Keyboard: ← → 15 min (Shift: 1 h), ↑ ↓ speed, Home/End, space play/pause.
document.addEventListener("keydown", (e) => {
  if (e.target.tagName === "SELECT") return;
  const big = e.shiftKey ? 4 : 1;
  switch (e.key) {
    case " ": togglePlay(); break;
    case "ArrowRight": step(big); break;
    case "ArrowLeft": step(-big); break;
    case "ArrowUp": setSpeed(1); break;
    case "ArrowDown": setSpeed(-1); break;
    case "Home": setPlaying(false); seek(P.first); break;
    case "End": setPlaying(false); seek(P.last); break;
    default: return;
  }
  e.preventDefault();
});

// ---------- heatmap ----------
let HL = 170; const HT = 22, HB = 44, GAP = 16, ROW = 17;
let heatCache = null, G = null;
const lift = new Float32Array(2 * S); let hover = -1; // hover = panel * S + row
function buildHeat() {
  const cv = $("heat"), w = cv.clientWidth; if (!w) return;
  const h = HT + S * ROW + HB, dpr = devicePixelRatio || 1;
  cv.style.height = h + "px"; cv.width = w * dpr; cv.height = h * dpr;
  const off = document.createElement("canvas"); off.width = w * dpr; off.height = h * dpr;
  const g = off.getContext("2d"); g.scale(dpr, dpr);
  g.font = "12px 'Golos Text', system-ui"; HL = 14 + Math.max(...P.segs.map(s => g.measureText(s.label).width));
  const x0 = P.first, n = P.last - x0 + 1, pw = (w - HL - GAP) / 2, cw = pw / n;
  g.textBaseline = "middle";
  P.segs.forEach((s, i) => { g.fillStyle = C.ink; g.textAlign = "right"; g.fillText(s.label, HL - 8, HT + i * ROW + ROW / 2); });
  DIRS.forEach((d, j) => {
    const left = HL + j * (pw + GAP);
    g.fillStyle = C.ink; g.textAlign = "left"; g.font = "600 12.5px 'Golos Text', system-ui";
    g.fillText(j === 0 ? "На север, к Девяткину" : "На юг, к Проспекту Ветеранов", left, 9);
    g.font = "12px 'Golos Text', system-ui";
    for (let i = 0; i < S; i++) for (let k = x0; k <= P.last; k++) {
      let c;
      if (state.mode === "diff") { const a = P.data.policy.ratio[d][i][k], b = P.data.baseline.ratio[d][i][k]; c = diffBand(a == null || b == null ? null : a - b); }
      else c = band(P.data[variantOf()].ratio[d][i][k]);
      g.fillStyle = c || C.empty; g.fillRect(left + (k - x0) * cw, HT + i * ROW, Math.ceil(cw), ROW - 2);
    }
    g.fillStyle = C.muted; g.textAlign = "center";
    for (let k = x0; k <= P.last; k++) if (P.times[k].endsWith(":00") && +P.times[k].slice(0, 2) % 4 === 2)
      g.fillText(P.times[k], left + (k - x0 + 0.5) * cw, HT + S * ROW + 10);
  });
  heatCache = off; G = { pw, cw, x0, dpr };
}
function focusBa() { const a = focusAct >= 0 ? P.actions[focusAct] : null; return a && a.ba && a.seg != null ? a : null; }
function focusRow() { const a = focusBa(); return a ? DIRS.indexOf(a.dir) * S + a.seg : -1; }
function drawHeat() {
  if (!heatCache) buildHeat(); if (!heatCache) return;
  const cv = $("heat"), g = cv.getContext("2d"), { pw, cw, x0, dpr } = G;
  g.setTransform(1, 0, 0, 1, 0, 0); g.clearRect(0, 0, cv.width, cv.height); g.drawImage(heatCache, 0, 0); g.scale(dpr, dpr);
  // the hovered row floats up and grows; rows that lost hover settle back
  const order = [...lift.keys()].filter(i => lift[i] > 0.01).sort((a, b) => lift[a] - lift[b]);
  for (const idx of order) {
    const a = lift[idx], j = Math.floor(idx / S), i = idx % S, left = HL + j * (pw + GAP), y = HT + i * ROW;
    const sh = ROW - 2, dh = sh * (1 + 0.55 * a), dw = pw * (1 + 0.012 * a), dy = y + sh / 2 - dh / 2 - 2 * a;
    g.save(); g.shadowColor = `rgba(27,36,48,${0.3 * a})`; g.shadowBlur = 10 * a; g.shadowOffsetY = 3 * a;
    g.drawImage(heatCache, left * dpr, y * dpr, pw * dpr, sh * dpr, left - (dw - pw) / 2, dy, dw, dh); g.restore();
    g.fillStyle = "#fff"; g.fillRect(0, y - 1, HL - 2, ROW);
    g.fillStyle = C.ink; g.textAlign = "right"; g.textBaseline = "middle"; g.font = `${a > 0.5 ? 600 : 400} ${12 + 1.5 * a}px 'Golos Text', system-ui`;
    g.fillText(P.segs[i].label, HL - 8, y + ROW / 2 - 2 * a);
  }
  const fa = focusBa(), cvEl = $("heat");
  if (fa) {
    const j = DIRS.indexOf(fa.dir), left = HL + j * (pw + GAP), ka = Math.max(x0, fa.ba.k0), kb = Math.min(P.last, fa.ba.k1);
    if (kb >= ka) { g.strokeStyle = C.ink; g.lineWidth = 2; g.strokeRect(left + (ka - x0) * cw, HT + fa.seg * ROW, (kb - ka + 1) * cw, ROW - 2); }
    cvEl.dataset.focus = `${fa.dir}:${fa.seg}:${fa.ba.k0}-${fa.ba.k1}`;
  } else delete cvEl.dataset.focus;
  const t = $("clock").textContent, bot = HT + S * ROW - 2;
  DIRS.forEach((d, j) => {
    const left = HL + j * (pw + GAP), x = left + (state.pos - x0 + 0.5) * cw;
    g.fillStyle = "rgba(255,255,255,.45)"; g.fillRect(x, HT, left + pw - x, bot - HT); // still ahead
    for (const ac of P.actions) { if (ac.seg == null || ac.dir !== d || ac.k < x0 || ac.k > P.last) continue;
      const ax = left + (ac.k - x0 + 0.5) * cw, ay = HT + ac.seg * ROW + (ROW - 2) / 2, r = ac.critical ? 5 : 4;
      g.globalAlpha = ac.k <= state.pos ? 1 : 0.45; g.beginPath(); g.moveTo(ax, ay - r); g.lineTo(ax + r, ay); g.lineTo(ax, ay + r); g.lineTo(ax - r, ay); g.closePath();
      g.fillStyle = ac.critical ? C.over : "#fff"; g.fill(); g.lineWidth = 1.2; g.strokeStyle = C.ink; g.stroke(); }
    g.globalAlpha = 1;
    g.fillStyle = C.ink; g.fillRect(x - 1, HT - 4, 2, bot - HT + 8);
    g.font = "600 11px 'Golos Text', system-ui"; const tw = g.measureText(t).width + 10;
    g.fillRect(x - 1, bot, 2, 24); g.fillRect(x - tw / 2, bot + 22, tw, 17);
    g.fillStyle = "#fff"; g.textAlign = "center"; g.textBaseline = "middle"; g.fillText(t, x, bot + 31);
  });
}
function heatHit(clientX, clientY) {
  if (!G) return null; const r = $("heat").getBoundingClientRect(), x = clientX - r.left, y = clientY - r.top;
  const j = x >= HL && x < HL + G.pw ? 0 : (x >= HL + G.pw + GAP && x < HL + 2 * G.pw + GAP ? 1 : -1);
  const jj = j >= 0 ? j : (x < HL + G.pw + GAP / 2 ? 0 : 1); // while dragging, the gap belongs to the nearest panel
  return { x, y, j, i: Math.floor((y - HT) / ROW), k: G.x0 + (x - HL - jj * (G.pw + GAP)) / G.cw - 0.5 };
}
dragArea($("heat"), (cx, cy, moving) => { const h = heatHit(cx, cy); if (!h || (h.j < 0 && !moving)) return null; return h.k; },
  () => { $("tip").style.display = "none"; });
$("heat").addEventListener("mousemove", (e) => {
  const h = heatHit(e.clientX, e.clientY), tip = $("tip");
  const nh = h && h.j >= 0 && h.i >= 0 && h.i < S ? h.j * S + h.i : -1; if (nh !== hover) { hover = nh; dirty = true; }
  if (nh < 0 || $("heat").classList.contains("drag")) { tip.style.display = "none"; return; }
  const d = DIRS[h.j], k = Math.min(P.last, Math.max(P.first, Math.round(h.k))); let text;
  if (state.mode === "diff") { const a = P.data.policy.ratio[d][h.i][k], b = P.data.baseline.ratio[d][h.i][k];
    text = a == null || b == null ? "нет движения" : `политика ${sfmt((a - b) * 100)} п.п. к режиму без управления`; }
  else { const V = P.data[variantOf()], r = V.ratio[d][h.i][k], f = V.fill[d][h.i][k], l = V.left[d][h.i][k];
    text = r == null ? "нет движения" : `спрос ${Math.round(r * 100)} % вместимости, поезда заполнены до ${Math.round(f * 100)} %` + (l > 0.5 ? `, не уехали ${fmt(l)} чел.` : ""); }
  const acts = P.actions.filter(a => a.seg === h.i && a.dir === d && a.k === k);
  tip.textContent = `${P.segs[h.i].tip}, ${h.j === 0 ? "на север" : "на юг"}, ${P.times[k]}: ${text}` + (acts.length ? `. Решение: ${acts[0].what}` : "");
  const r = $("heat").getBoundingClientRect(); tip.style.display = "block";
  tip.style.left = Math.max(4, Math.min(h.x + 12, r.width - tip.offsetWidth - 4)) + "px"; tip.style.top = (h.y + 16) + "px";
});
$("heat").addEventListener("mouseleave", () => { hover = -1; dirty = true; $("tip").style.display = "none"; });

// ---------- line strip ----------
let stripEls = null;
function buildStrip() {
  const sv = $("strip"), w = sv.clientWidth; if (!w) return; sv.innerHTML = "";
  const L = 70, R = 24, dx = (w - L - R) / (ST - 1), yN = 46, yS = 112, yL = 79;
  el("text", { x: 0, y: yN + 4, fill: C.muted, "font-size": 12 }, sv).textContent = "на север";
  el("text", { x: 0, y: yS + 4, fill: C.muted, "font-size": 12 }, sv).textContent = "на юг";
  el("line", { x1: L, x2: w - R, y1: yL, y2: yL, stroke: C.line1, "stroke-width": 3 }, sv);
  const segs = [];
  for (let i = 0; i < S; i++) { const x = L + i * dx + 3, wd = dx - 6, row = {};
    for (const [d, y] of [["north", yN], ["south", yS]]) {
      const gEl = el("g", { class: "sg" }, sv);
      const r = el("rect", { x, y: y - 14, width: wd, height: 28, rx: 4 }, gEl);
      const t = el("text", { x: x + wd / 2, y: y + 4, "text-anchor": "middle", "font-size": 11, "font-weight": 600, "pointer-events": "none" }, gEl);
      row[d] = { r, t, ti: el("title", {}, gEl) }; }
    segs.push(row); }
  const st = [];
  for (let s = 0; s < ST; s++) { const x = L + s * dx;
    const gq = el("g", { class: "sg" }, sv);
    const q = el("circle", { cx: x, cy: yL, r: 0, fill: C.tight, "fill-opacity": .85, stroke: C.ink, "stroke-width": 1.5 }, gq);
    el("circle", { cx: x, cy: yL, r: 4, fill: "#fff", stroke: C.line1, "stroke-width": 2 }, gq);
    const qt = el("title", {}, gq);
    el("text", { x, y: 146, "font-size": 11.5, fill: C.ink, "text-anchor": "end", transform: `rotate(-40 ${x} 146)` }, sv).textContent = P.stations[s];
    const ring = el("circle", { cx: x, cy: yL, r: 11, fill: "none", stroke: C.tight, "stroke-width": 2, "stroke-dasharray": "3 2", visibility: "hidden", class: "anom", "pointer-events": "none" }, gq);
    st.push({ q, qt, ring }); }
  stripEls = { segs, st };
}
function drawStrip() {
  if (!stripEls) buildStrip(); if (!stripEls) return;
  const D = P.data[variantOf()], k = Math.floor(state.pos);
  const recent = P.actions.filter(a => a.seg != null && a.applied && a.k <= k && a.k > k - 4);
  for (let i = 0; i < S; i++) for (const d of DIRS) {
    const f = at(D.ratio[d][i], state.pos), e = stripEls.segs[i][d];
    e.r.setAttribute("fill", smooth(f));
    e.t.textContent = f != null && f > 0.8 ? Math.round(f * 100) + "%" : "";
    e.t.setAttribute("fill", f != null && f > OVER ? "#fff" : C.ink);
    const hit = recent.filter(a => a.seg === i && a.dir === d);
    const fa = focusBa(), isF = fa && fa.seg === i && fa.dir === d;
    e.r.setAttribute("class", isF ? "focus" : hit.length ? "hl" + (hit.some(a => a.critical) ? " crit" : "") : "");
    const why = [...new Set([...P.reasons[i][k], ...P.reasons[i + 1][k]])];
    e.ti.textContent = `${P.segs[i].tip}, ${d === "north" ? "на север" : "на юг"}: ` + (f == null ? "нет движения" : `спрос ${Math.round(f * 100)} % вместимости`) + (hit.length ? `. Решение: ${hit[hit.length - 1].what}` : "") + (why.length ? "\n" + why.join("\n") : "");
  }
  for (let s = 0; s < ST; s++) {
    const a = at(D.queues.north[s], state.pos) || 0, b = at(D.queues.south[s], state.pos) || 0, tot = a + b;
    stripEls.st[s].q.setAttribute("r", tot < 1 ? 0 : Math.max(5, Math.min(24, Math.sqrt(tot) * 1.05)));
    stripEls.st[s].qt.textContent = stationTip(`${P.stations[s]}: на север ${fmt(a)}, на юг ${fmt(b)} чел.`, P.reasons[s][k], P.anomaly[s][k]);
    stripEls.st[s].ring.setAttribute("visibility", P.anomaly[s][k] ? "visible" : "hidden");
  }
}

// ---------- waiting chart ----------
let W = null;
function buildWait() {
  const sv = $("wait"), w = sv.clientWidth; if (!w) return; sv.innerHTML = "";
  const h = 250, L = 46, R = 10, T = 10, B = 26, x0 = P.first, x1 = P.last;
  const X = (k) => L + (k - x0) / Math.max(1, x1 - x0) * (w - L - R), Y = (v) => T + (1 - v / maxWait) * (h - T - B);
  for (const f of [0, 0.5, 1]) {
    el("line", { x1: L, x2: w - R, y1: Y(maxWait * f), y2: Y(maxWait * f), stroke: C.rule }, sv);
    el("text", { x: L - 6, y: Y(maxWait * f) + 4, "text-anchor": "end", "font-size": 11, fill: C.muted }, sv).textContent = fmt(maxWait * f); }
  for (let k = x0; k <= x1; k++) if (P.times[k].endsWith(":00") && +P.times[k].slice(0, 2) % 4 === 2)
    el("text", { x: X(k), y: h - 6, "text-anchor": "middle", "font-size": 11, fill: C.muted }, sv).textContent = P.times[k];
  for (const [v, col, dash] of [["baseline", C.muted, "5 4"], ["policy", C.calm, ""]]) {
    let p = ""; for (let k = x0; k <= x1; k++) p += (k === x0 ? "M" : "L") + X(k).toFixed(1) + " " + Y(P.data[v].kpi.waiting[k]).toFixed(1);
    el("path", { d: p, fill: "none", stroke: col, "stroke-width": 2, "stroke-dasharray": dash }, sv); }
  const ph = el("line", { y1: T, y2: h - B, stroke: C.ink, "stroke-width": 2 }, sv);
  const dot = el("circle", { r: 4.5, fill: C.calm, stroke: "#fff", "stroke-width": 2 }, sv);
  W = { X, Y, ph, dot, L, R, w, x0, x1 };
  $("waitSub").innerHTML = `<span style="color:${C.calm}">— с политикой</span>&nbsp;&nbsp;<span style="color:${C.muted}">- - без управления</span>`;
}
function drawWait() {
  if (!W) buildWait(); if (!W) return; const x = W.X(state.pos);
  W.ph.setAttribute("x1", x); W.ph.setAttribute("x2", x);
  W.dot.setAttribute("cx", x); W.dot.setAttribute("cy", W.Y(at(P.data[variantOf()].kpi.waiting, state.pos)));
}
dragArea($("wait"), (cx) => { if (!W) return null; const r = $("wait").getBoundingClientRect();
  return W.x0 + (cx - r.left - W.L) / (W.w - W.L - W.R) * (W.x1 - W.x0); });

// ---------- KPIs ----------
function chip(id, d, neutral) {
  const e = $(id); if (state.mode === "baseline") { e.textContent = "режим без управления"; e.className = "chip"; return; }
  if (Math.round(d) === 0) { e.textContent = "как без управления"; e.className = "chip"; return; }
  e.textContent = sfmt(d) + " к режиму без управления"; e.className = neutral ? "chip" : "chip " + (d < 0 ? "good" : "bad");
}
function overCount(v) { let c = 0; for (const d of DIRS) for (let i = 0; i < S; i++) { const f = at(P.data[v].ratio[d][i], state.pos); if (f != null && f > OVER) c++; } return c; }
function drawKpis() {
  const K = P.data[variantOf()].kpi, B = P.data.baseline.kpi, val = (x) => at(K[x], state.pos), base = (x) => at(B[x], state.pos);
  for (const [id, key] of [["wait", "waiting"], ["denied", "denied"], ["wpm", "wait_pax_min"]]) {
    $("k_" + id).textContent = fmt(val(key)); chip("d_" + id, val(key) - base(key)); }
  $("k_trains").textContent = Math.round(val("trains_in_service")); chip("d_trains", Math.round(val("trains_in_service")) - Math.round(base("trains_in_service")), true);
  const oc = overCount(variantOf()); $("k_over").textContent = oc + " из " + 2 * S; chip("d_over", oc - overCount("baseline"));
}

// ---------- actions sequence ----------
function baHtml(a) {
  const b = a.ba, pc = (x) => x == null ? "–" : Math.round(x * 100) + "\u00A0%", cls = (x, y) => x == null || y == null ? "" : y < x ? "good" : y > x ? "bad" : "";
  const pair = (u, v, f, unit) => `${u == null ? "–" : f(u)} → <span class="${cls(u, v)}">${v == null ? "–" : f(v)}</span>${unit}`;
  const parts = [a.win, "спрос/вместимость " + pair(b.peak[0], b.peak[1], pc, "")];
  if (b.trains) parts.push(`поездов ${b.trains[0]} → ${b.trains[1]}`);
  parts.push("остались " + pair(b.left[0], b.left[1], (x) => String(x), " чел."));
  return parts.filter(Boolean).join(" · ");
}
function buildActs() {
  const ul = $("acts"); ul.innerHTML = "";
  if (!P.actions.length) { ul.innerHTML = '<li style="display:block;cursor:default" class="st">Политика не принимала решений.</li>'; return; }
  P.actions.forEach((a) => {
    const li = document.createElement("li"); li.tabIndex = 0;
    if (a.critical) li.classList.add("crit"); if (a.error) li.classList.add("err");
    li.innerHTML = `<span></span><span><b></b> <span class="tg"></span><span class="badge" hidden>снимает перегрузку</span><span class="st"></span><span class="ba"></span></span>`;
    li.children[0].textContent = a.time; li.querySelector("b").textContent = a.what; li.querySelector(".tg").textContent = a.target;
    li.querySelector(".badge").hidden = !a.critical;
    li.querySelector(".st").textContent = a.status + (a.reason ? ": " + a.reason : ""); li.title = a.reason || "";
    const idx = P.actions.indexOf(a), setF = (v) => { if (focusAct !== v) { focusAct = v; dirty = true; } };
    if (a.ba) {
      li.querySelector(".ba").innerHTML = baHtml(a);
      li.addEventListener("mouseenter", () => setF(idx)); li.addEventListener("mouseleave", () => { if (li !== document.activeElement) setF(-1); });
      li.addEventListener("focus", () => { if (li.matches(":focus-visible")) setF(idx); }); li.addEventListener("blur", () => setF(-1));
    }
    const go = () => { setPlaying(false); seek(a.k); };
    li.onclick = go; li.onkeydown = (e) => { if (e.key === "Enter") go(); };
    ul.appendChild(li);
  });
}
let curAct = -2;
function drawActs() {
  const k = Math.floor(state.pos + 1e-6), items = $("acts").children;
  let cur = -1; P.actions.forEach((a, n) => { if (a.k <= k) cur = n; });
  const applied = P.actions.filter(a => a.k <= k && a.applied).length, crit = P.actions.filter(a => a.k <= k && a.critical).length;
  $("actCount").textContent = `${applied}/${P.actions.filter(a => a.applied).length}`;
  $("actCrit").textContent = crit; $("actCrit").hidden = !crit;
  if (cur === curAct || !P.actions.length) return;
  const forward = cur > curAct; curAct = cur;
  [...items].forEach((li, n) => { li.classList.toggle("future", n > cur); li.classList.toggle("current", n === cur); });
  if (cur >= 0 && forward && state.playing) { const li = items[cur]; li.classList.remove("flash"); void li.offsetWidth; li.classList.add("flash"); }
}

// Where the decision list should be scrolled: between the last reached decision and the next one,
// in proportion to time, so the list glides with the playhead instead of jumping.
function actScrollTarget() {
  const ul = $("acts"), items = ul.children, n = P.actions.length; if (!n || items.length < n) return null;
  const mid = (i) => items[i].offsetTop + items[i].offsetHeight / 2;
  let i = -1; P.actions.forEach((a, m) => { if (a.k <= state.pos) i = m; });
  let c;
  if (i < 0) c = mid(0);
  else if (i >= n - 1) c = mid(n - 1);
  else { const a = P.actions[i].k, b = P.actions[i + 1].k, f = b > a ? Math.min(1, (state.pos - a) / (b - a)) : 1; c = mid(i) + f * (mid(i + 1) - mid(i)); }
  return Math.max(0, Math.min(ul.scrollHeight - ul.clientHeight, c - ul.clientHeight / 2));
}
["wheel", "touchmove"].forEach(ev => $("acts").addEventListener(ev, () => { follow = false; }, { passive: true }));

// ---------- loop ----------
function render() {
  state.pos = clampPos(state.pos);
  const k = Math.floor(state.pos), mins = Math.floor((state.pos - k) * 15);
  const [hh, mm] = P.times[k].split(":").map(Number), tot = (hh * 60 + mm + mins) % 1440;
  const t = String(Math.floor(tot / 60)).padStart(2, "0") + ":" + String(tot % 60).padStart(2, "0");
  $("clock").textContent = t; $("nowTitle").textContent = "Линия в " + t;
  const cw = $("scrub").clientWidth / (P.last - P.first + 1), thumb = $("thumb");
  thumb.style.left = ((state.pos - P.first + 0.5) * cw) + "px"; thumb.dataset.t = t;
  $("scrub").setAttribute("aria-valuetext", t);
  drawOverview(); drawHeat(); drawStrip(); drawWait(); drawKpis(); drawActs();
}
let lastTs = null;
function loop(ts) {
  const dt = lastTs == null ? 0 : Math.min(0.1, (ts - lastTs) / 1000); lastTs = ts;
  if (state.playing) { state.pos += dt * state.speed; if (state.pos >= P.last) { state.pos = P.last; setPlaying(false); } dirty = true; }
  let moving = false;
  for (let i = 0; i < lift.length; i++) { const target = i === hover || i === focusRow() ? 1 : 0, d = target - lift[i];
    if (Math.abs(d) > 0.005) { lift[i] += d * Math.min(1, dt * 12); moving = true; } else lift[i] = target; }
  if (dirty || moving) { dirty = false; try { render(); } catch (e) { console.error(e); } }
  if (follow && focusAct < 0) { const t0 = actScrollTarget(), ul = $("acts");
    if (t0 != null) { const t = Math.max(0, Math.min(t0, ul.scrollHeight - ul.clientHeight)), df = t - ul.scrollTop;
      if (Math.abs(df) >= 1) ul.scrollTop += Math.sign(df) * Math.min(Math.abs(df), Math.max(1, Math.abs(df) * Math.min(1, dt * 8)));
      else if (df !== 0) ul.scrollTop = t; } }
  requestAnimationFrame(loop);
}
function setPlaying(on) {
  state.playing = on && state.pos < P.last; const b = $("play");
  b.classList.toggle("on", state.playing); b.title = state.playing ? "Пауза (пробел)" : "Пуск (пробел)"; b.setAttribute("aria-label", state.playing ? "Пауза" : "Пуск");
  $("playIcon").innerHTML = state.playing ? '<path d="M6 4h4v16H6zM14 4h4v16h-4z"/>' : '<path d="M7 4v16l13-8z"/>';
}
function togglePlay() { if (!state.playing && state.pos >= P.last) seek(P.first); follow = true; setPlaying(!state.playing); }
function step(d) { setPlaying(false); seek(Math.round(state.pos) + d); }
$("play").onclick = togglePlay;
$("stop").onclick = () => { setPlaying(false); seek(P.first); };
$("back").onclick = () => step(-1);
$("next").onclick = () => step(1);
const SPEEDS = [1, 2, 4];
function setSpeed(dir, exact) {
  const i = SPEEDS.indexOf(state.speed), j = exact != null ? SPEEDS.indexOf(exact) : Math.min(SPEEDS.length - 1, Math.max(0, i + dir));
  state.speed = SPEEDS[j]; [...$("speed").children].forEach(b => b.classList.toggle("on", +b.dataset.s === state.speed));
}
$("speed").addEventListener("click", (e) => { const s = e.target.dataset.s; if (s) setSpeed(0, +s); });
$("mode").onchange = (e) => { state.mode = e.target.value; heatCache = null; ovCache = null; drawLegend(); dirty = true; };
function drawLegend() {
  const items = state.mode === "diff"
    ? [["политика разгрузила", C.good], ["без изменений", "#EEF1F4"], ["добавила нагрузку", C.over]]
    : [["до 50 %", C.quiet], ["50–80 %", C.calm], ["80–100 %", C.tight], ["больше 100 %", C.over]];
  $("legend").innerHTML = items.map(([t, c]) => `<span><i style="background:${c}"></i>${t}</span>`).join("") +
    `<span><i class="dm" style="background:${C.over}"></i>снимает перегрузку</span><span><i class="dm" style="background:#fff"></i>другое решение</span>`;
}
renderBanner(P.banner, $("banner"));
$("meta").textContent = `МСК, ${P.date}, сценарий «${P.scenario}», политика: ${P.policy}`;
function layout() { if (!document.body.clientWidth) return; heatCache = null; ovCache = null; stripEls = null; W = null; dirty = true; }
buildActs(); drawLegend();
new ResizeObserver(layout).observe(document.body);
requestAnimationFrame(loop);
if (document.fonts) document.fonts.ready.then(layout);
</script>
</body>
</html>
