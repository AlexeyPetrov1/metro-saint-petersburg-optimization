# Эксплуатация 1 линии СПб: константы для рекомендаций и симулятора (раздел 8 docs/ml_tz.md).
# В ML отсюда идёт признак «парность по плану». Источники — файлы организаторов в data/raw/spb/.

turnaround_min: 99                    # полный оборот «туда–обратно»; .txt организаторов
trains_on_line: "pairs * turnaround_min / 60"   # по плану: 32 пары → 53 состава, 18 → 30

pairs:                                # пар поездов в час
  max: 32                             # МО-I: 2025, II и III кв. 2026
  mean: 20.5                          # МО-I: 20,62 (2025), 21,13 (II кв.), 20,49 (III кв.)
  theoretical_max: 34                 # при минимальном интервале 1:45

min_headway:                          # «График движения (с 01.09.2026)»
  weekday: "1:45"
  weekend_morning: "2:30"

reserve:                              # .txt организаторов
  trains: 4
  depots: {Автово: 2, Северное: 2}
  deploy_min: [15, 20]                # выход на линию

train_capacity:                       # «Вместимость составов», чел. на состав из 8 вагонов
  used: 1458                          # организаторы просят считать это максимумом
  cars: 8
  density_per_m2: 5
  models:
    yubileyny_81_722: 1458            # 2×168 + 6×187; в таблице организаторов подписи перепутаны
    baltiets_81_725: 1478
  yubileyny_at_10_per_m2: 2608        # максимум при 10 чел/м²

throughput_per_direction: "pairs * train_capacity.used"   # пасс./ч; 32 пары → 46 656

